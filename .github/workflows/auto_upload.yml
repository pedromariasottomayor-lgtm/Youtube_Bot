# ─────────────────────────────────────────────────────────────────
# GitHub Actions Workflow — Auto YouTube Upload
# Posts 3x/day: 8AM, 2PM, 8PM UTC (optimal for English audience)
# YouTube API limit: 6 videos/day — we use 3 for safety
#
# Robustness features:
#   - Retry: bot runs up to 3 attempts per schedule (transient
#     failures like Gemini/API hiccups no longer kill the run)
#   - Heartbeat: every run commits a timestamp file so the repo is
#     never "inactive" for 60 days (GitHub auto-disables scheduled
#     workflows on inactive repos)
#   - Token self-heal: refreshed OAuth token is written back to the
#     YOUTUBE_TOKEN_B64 secret automatically (needs GITHUB_PAT)
#   - Failure alert: a GitHub issue is opened/updated on failure so
#     you get an email notification — never fail silently
# ─────────────────────────────────────────────────────────────────

name: Auto YouTube Upload

on:
  schedule:
    # 3 posts per day, spaced 6 hours apart
    - cron: "0 8 * * *"    # 8:00 AM UTC (4 AM EST / 9 AM UK)
    - cron: "0 14 * * *"   # 2:00 PM UTC (10 AM EST / 3 PM UK)
    - cron: "0 20 * * *"   # 8:00 PM UTC (4 PM EST / 9 PM UK)

  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

concurrency:
  group: upload-video
  cancel-in-progress: false

jobs:
  upload-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore state
        run: |
          # state.json is committed to the repo (checkout already restored it).
          # Just make sure it exists so the bot never starts from nothing.
          if [ ! -f state.json ]; then
            echo '{"index":0,"videos_today":0,"today":"","total_uploaded":0,"history":[],"uploaded_videos":[],"used_topics":[],"used_titles":[],"used_hooks":[],"last_video_id":"","last_upload":""}' > state.json
            echo "state.json created fresh."
          fi
          echo "state.json entries: $(python3 -c 'import json;print(len(json.load(open("state.json")).get("used_titles",[])))')"

      - name: Restore YouTube token
        run: |
          if [ -n "${{ secrets.YOUTUBE_TOKEN_B64 }}" ]; then
            echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | base64 -d > youtube_token.pickle
          fi

      - name: Run YouTube bot (with retries)
        id: bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "━━━ Attempt $attempt/3 ━━━"
            if python main.py; then
              echo "bot_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $attempt failed; waiting $((attempt * 60))s before retry..."
            sleep $((attempt * 60))
          done
          echo "bot_ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Save state
        if: always()
        run: |
          # Persist state.json back to the repo itself. The actions/cache
          # store expires after 7 days and silently reset the bot's memory
          # before (causing repeated titles). A real commit never expires.
          git config user.name "mindrank-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json || true
          git diff --cached --quiet || git commit -m "chore: state update run=${{ github.run_number }}"

      - name: Save updated YouTube token
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "BOT_PAT secret not set — skipping token refresh."; exit 0
          fi
          if [ ! -f youtube_token.pickle ]; then
            echo "No token file to save."; exit 0
          fi
          TOKEN_B64=$(base64 -w 0 youtube_token.pickle)
          # gh handles NaCl encryption of the secret for us
          echo "$TOKEN_B64" | gh secret set YOUTUBE_TOKEN_B64 \
            --repo "${{ github.repository }}" && echo "Secret updated."

      - name: Heartbeat — keep repo active (never get auto-disabled)
        if: always()
        run: |
          # GitHub disables scheduled workflows after 60 days without
          # repo activity. This commit guarantees activity every run.
          # It also pushes the state.json commit made by the previous step.
          git config user.name "mindrank-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ run=${{ github.run_number }} status=${{ job.status }}" > .heartbeat/last_run.txt
          git add .heartbeat/last_run.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat ${{ github.run_number }} (${{ job.status }})"
          # Rebase onto any change made concurrently, then push once.
          git pull --rebase --autostash -q || true
          git push || echo "heartbeat push skipped (non-fatal)"

      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
        run: |
          TITLE="⚠️ Upload falhou — run ${{ github.run_number }}"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}

          O upload automático falhou as 3 tentativas. Vê o log do run.
          Causa mais comum: token do YouTube expirado → re-autenticar."
          # Reuse existing open alert for this run title to avoid spam
          EXISTING=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/search/issues?q=repo:${{ github.repository }}+in:title+state:open+type:issue+${TITLE}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["items"][0]["number"] if d.get("items") else "")')
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"title": os.environ["TITLE"], "body": os.environ["BODY"]}))')
          if [ -n "$EXISTING" ]; then
            curl -sS -o /dev/null -X PATCH -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$EXISTING" \
              -d "$PAYLOAD"
          else
            curl -sS -o /dev/null -X POST -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$PAYLOAD"
          fi
